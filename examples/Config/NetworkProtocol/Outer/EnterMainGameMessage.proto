syntax = "proto3";

// EnterMainGameMessage.proto
// 客户端进入主游戏的一次性请求/响应:登录 RPC 完成、主游戏 UI 即将就绪时由客户端发起,
// 服务端回带订单快照,客户端拿到响应后整份覆盖本地视图。
//
// 身份从会话取(GateAccountFlagComponent.Account.PlayerId),请求不带 playerId 字段。
// 失败降级:订单段沿 MergeOrderServiceHelper 现有基线(MongoDB 抖动 / 未登录 → 空 ActiveOrders 占位)。
//
// 局内对局现场(盘面 / cosmetic + 合成经济叠加层切片)不再走本请求 —— 由 GameStart(续局)/ GameSnapshot 回带,
// 见 BlockBlastGameMessage.proto 的 SliceJson 字段。

/// 客户端进入主游戏(登录后、主游戏可交互前发起;每次进入主游戏阶段调用一次)
message C2G_EnterMainGameRequest // IRequest,G2C_EnterMainGameResponse
{
}

/// 服务端对进入主游戏请求的响应:订单快照 + 道具持有 + 塔罗收集
message G2C_EnterMainGameResponse // IResponse
{
	/// 订单系统当前激活快照(派生自 PlayerDoc 的 OrderCursor / DeliveredMask;
	/// 若服务不可用 / 玩家文档读不到 → 空 ActiveOrders 占位,客户端按"无订单可交付"降级显示)
	MergeOrderSnapshot OrderSnapshot = 1;
	/// 道具持有整份快照(PlayerDoc.ItemHoldings 投影,当前业务方 = 塔罗碎片;仅 ItemDataLoaded=true 时可信)
	repeated ItemHolding ItemHoldings = 2;
	/// 已合成塔罗牌 id 全集(PlayerDoc.CollectedTarotIds 投影;仅 ItemDataLoaded=true 时可信)
	repeated int32 CollectedTarotIds = 3;
	/// 道具持有 + 塔罗收集两段是否真取到玩家数据:true = 上两字段为权威值(空 = 权威空集,客户端整份覆盖);
	/// false = 服务端降级(未登录 / 服务不可用 / 读库失败),客户端保留既有投影不清空。
	/// proto3 repeated 无法区分「空集」与「缺失」,靠本标志承载该区分。
	bool ItemDataLoaded = 4;
}
