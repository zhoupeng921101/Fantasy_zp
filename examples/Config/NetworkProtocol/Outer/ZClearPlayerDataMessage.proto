syntax = "proto3";

// ZClearPlayerDataMessage.proto
// 清空玩家数据·重置为新手:客户端按当前会话 playerId 请求把自己的持久数据清掉/重置为默认新手态,
// 保留账号身份(playerId 不变、账号→playerId 绑定不变),使该号下次登录从零开始、与全新玩家一致。
// 范围:玩家文档(四货币 / 体力恢复锚点 / 订单状态等所有持久字段)字段重置为默认值;
// 云存档文档(CloudSaveDoc,_id=playerId)整条删除。
// 身份从会话取(GateAccountFlagComponent.Account),请求不带任何参数,只清调用方自己,无跨玩家面。
//
// 文件名 Z 前缀刻意排到所有现存 .proto 之后:导出工具按文件名字母序遍历分配 opcode(单调计数器),
// 新消息排在末尾只消费新计数值,不挪动任何既有 opcode(EnterMainGame 等在途分配稳定不变)。

/// 清档裁决结果码
enum ClearPlayerDataResultCode
{
	/// 清档成功(玩家文档已重置为默认新手态、云存档文档已删除或本就不存在)。幂等:重复清同样返 Success。
	Success = 0,
	/// 会话未挂账号身份(35 登录失败 / 链路异常 / Account.PlayerId 空)。客户端段重登。
	NotLoggedIn = 1,
	/// 服务不可用(MongoDB 不可达 / 写入异常)。变更未生效(或部分生效),客户端段提示重试。
	ServiceUnavailable = 2,
}

/// 客户端请求清空自己的玩家数据(身份从会话取,不携带 playerId / 不接受指定清别人)
message C2G_ClearPlayerDataRequest // IRequest,G2C_ClearPlayerDataResponse
{
}
/// 服务端清档裁决响应
message G2C_ClearPlayerDataResponse // IResponse
{
	ClearPlayerDataResultCode ResultCode = 1; /// 裁决结果码
}
