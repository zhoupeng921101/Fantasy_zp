syntax = "proto3";

// PlayerInfoMessage.proto
// 玩家信息聚合协议:登录成功后服务端主动下发一份完整玩家信息(基础档案 + 三数值属性)。
// 取代原 G2C_PropertyInitSnapshot 的登录推送 —— 由本快照统一承载属性,登录只推这一条。
// 身份与数值均服务端权威;数值属性复用 PlayerPropertyMessage.proto 的 PropertyType / PropertyAmount。

/// 玩家信息(基础档案 + 三数值属性快照),登录后整份下发
message PlayerInfo
{
	string AccountId = 1;                      /// 账号 ID(UUID,= 登录账号名)
	string Nickname = 2;                       /// 昵称(首登默认空串,后续改名功能再填)
	int32 Level = 3;                           /// 等级(首登默认 1)
	int64 Exp = 4;                             /// 经验(首登默认 0)
	repeated PropertyAmount Properties = 5;    /// 三数值属性当前余额(金币/钻石/体力,复用 PropertyAmount)
	int32 SchemaVersion = 6;                   /// schema 版本(加字段时升,客户端据此识别)
	int32 RenameCount = 7;                     /// 改名次数(服务端权威;客户端据此算下次改名费:0=首次免费)
	int32 CurrentAvatarId = 8;                 /// 当前佩戴头像 id(服务端权威;缺省与客户端 DefaultAvatarId=1 对齐)
	int32 CurrentFrameId = 9;                  /// 当前佩戴头像框 id(服务端权威;缺省与客户端 DefaultFrameId=101 对齐)
	repeated int32 UnlockedAvatarIds = 10;     /// 已解锁头像 id 集合(服务端权威;首登空,客户端 bootstrap 上报默认解锁后填入)
	repeated int32 UnlockedFrameIds = 11;      /// 已解锁头像框 id 集合(服务端权威;同上)
	int32 WishUsedToday = 12;                  /// 今日已用祈愿次数(服务端权威;快照前已跑懒每日重置,故为重置后当日值)
	int32 WishDailyLimit = 13;                 /// 每日祈愿次数上限(= WishConfigServer.WishDailyLimit,供客户端算今日剩余)
	int32 SkinMono = 14;                       /// 皮肤态服务端权威(3b):是否单色皮肤模式(0=彩色 / 1=单色;缺省 0=彩色)
	int32 SkinMonoId = 15;                     /// 皮肤态服务端权威(3b):当前单色皮肤 id(彩色态 -1;缺省 -1)
	int64 TempleDecorated = 16;                /// 神庙装饰服务端权威(3b):已装饰厅数标量(前缀语义,= 已修厅数;缺省 0)
	// 背包服务端权威:两轨全量并入登录快照,一次性下发(不另起查询 RPC)。类型见 InventoryMessage.proto。
	repeated InventoryHolding Holdings = 17;   /// 堆叠轨全量(itemId → 数量)
	repeated InventoryLot Lots = 18;           /// 批次轨全量(有有效期道具,已剔除过期批次)
	int64 ServerNowMs = 19;                    /// 服务端权威当前时刻(Unix 毫秒 UTC);客户端锚定倒计时基准,批次剩余 = ExpireMs - (ServerNowMs + 本地流逝)
	bool InventoryLoaded = 20;                 /// 背包权威整份标志(true=Holdings/Lots 为权威全量;false=服务端读库降级,客户端保留本地投影不清空)
	int64 LastUseReqSeq = 21;                  /// 使用事务幂等锚当前值(服务端持久);客户端登录 seed 本地 reqSeq 底,保重登后首个使用序号 > 服务端已处理值(防时钟回拨误判 Duplicate)
	int32 AdEnergyUsedToday = 22;              /// 今日已用看广告领体力次数(服务端权威;快照前已跑懒每日重置,故为重置后当日值)
	int32 AdEnergyDailyLimit = 23;             /// 每日看广告领体力次数上限(= AdEnergyConfigServer.DailyMax,供客户端算今日剩余)
	int32 BuyEnergyUsedToday = 24;             /// 今日已用钻石购买体力次数(服务端权威;快照前已跑懒每日重置,故为重置后当日值)
	int32 BuyEnergyDailyLimit = 25;            /// 每日钻石购买体力次数上限(= BuyEnergyConfigServer.DailyLimit,供客户端算今日剩余)
}

/// 服务端登录后下发玩家信息整份快照(主动 push,取代 G2C_PropertyInitSnapshot)
message G2C_PlayerInfoSnapshot // IMessage
{
	PlayerInfo Info = 1;                       /// 玩家完整信息(基础档案 + 三属性)
}
