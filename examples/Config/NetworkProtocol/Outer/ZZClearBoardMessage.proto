syntax = "proto3";

// ZZClearBoardMessage.proto
// GM 清盘(调试用):清空当前对局盘面全部已占格。作为一次 board-mutating 动作推进 Step
// (与落子 / 消除道具同一步号轴),但不消耗候选、不推进发牌调度、不续发、不触发全清判定 / 不给全清奖;
// 分数与候选 / 发牌器态不变。身份从会话取,请求只带 GameId(+ 客户端清后局内叠加层切片,搭车存盘)。
// 响应回带新盘面 + 发牌器态供客户端重投影,契约对齐 G2C_ClearToolResponse(客户端复用盘面投影逻辑)。
//
// 文件名 ZZ 前缀刻意排到所有现存 .proto(含 ZClearPlayerData)之后:导出工具按文件名字母序遍历分配
// opcode(单调计数器),新消息只消费末尾新计数,不挪动任何既有 opcode。
// BlockGenState 定义在 BlockBlastGameMessage.proto,跨文件引用(导出工具整目录单一命名空间解析,无需 import)。

/// GM 清盘裁决结果码
enum ClearBoardResultCode
{
	/// 清盘成功(盘面已清空,Step 已推进)
	Cleared = 0,
	/// 对局不存在(gameId 在会话上查无此局)
	GameNotFound = 1,
	/// 会话未登录(无法确定身份)
	NotLoggedIn = 2
}

/// 客户端 GM 清盘请求(身份从会话取,不携带账号)
message C2G_ClearBoardRequest // IRequest,G2C_ClearBoardResponse
{
	int64 GameId = 1;      /// 目标对局 id
	string SliceJson = 2;  /// 客户端清后局内叠加层不透明切片,搭车存盘。服务端只搬运不解析
}
/// 服务端清盘裁决 + 最新权威态
message G2C_ClearBoardResponse // IResponse
{
	ClearBoardResultCode ResultCode = 1; /// 裁决结果码
	int32 Step = 2;                      /// 清盘后(或当前)权威步号
	int32 Score = 3;                     /// 当前权威分数(清盘不计分,回带当前值供对账)
	int32 ClearedCells = 4;              /// 本次清掉的格数(Cleared 时有效)
	repeated int32 Board = 5;            /// 最新权威棋盘(8 行位掩码,清盘后全 0)
	BlockGenState GeneratorState = 6;    /// 最新完整生成器状态向量(清盘不推进发牌,回带当前态供对账)
}
