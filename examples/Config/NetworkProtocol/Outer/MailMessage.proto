syntax = "proto3";

// MailMessage.proto
// 邮件运营来源 + 领奖裁决协议（服务端权威）。
// 设计基线：design-docs/32-mail-server.md §三 行为级协议契约。
// 玩家身份由服务端从联网会话取，请求不携带账号字段（防领他人/拉他人收件箱，见 §3.1 / §3.3）。
// 本增量只做运营推送来源 + 领奖校验（防重 + 内嵌附件全发 + 过期）；收件箱表现（排序/已读/删除/红点）留客户端（§读前必看 第 5 条）。

/// 领取奖励裁决结果码（§3.4）
enum MailClaimResultCode
{
	/// 成功并已授权发奖（响应附奖励列表；库 id 未登记时奖励列表为空但仍 Success，见 SV6）
	Success = 0,
	/// 按邮件标识 + 会话账号定位不到这封邮件（不崩，以结果码回包）
	MailNotFound = 1,
	/// 该邮件无附件（附件库 id = 0，纯通知邮件）；不发奖
	NoReward = 2,
	/// 本账号已领过此邮件（响应不附奖励列表）
	AlreadyClaimed = 3,
	/// 邮件有有效期且服务端时钟已超过（过期判定用服务端时钟）
	Expired = 4,
	/// 服务不可用（无法建立身份 / 无法处理）；客户端提示重试、邮件保持可领、不本地放行（§四）
	ServiceUnavailable = 5
}

/// 邮件发件人类型（服务端赋值；客户端可按类型配图标/名称）
enum MailSenderType
{
	/// 系统邮件（运营广播 / GM 默认）
	System = 0,
	/// 排行榜奖励（结算 / 每日 / 点赞）
	RankReward = 1
}

/// 邮件列表一条：客户端画收件箱用（不含奖励明细，领取时才随响应下发，见 §3.2 注）
message MailListItem
{
	string MailId = 1; /// 邮件标识（领取时回传定位；广播邮件与定向邮件用同一标识空间，客户端无需区分）
	MailSenderType Sender = 2; /// 发件人类型（服务端赋值）
	string Title = 3; /// 标题（真实文本，来自邮件模板）
	string Content = 4; /// 正文（真实文本，来自邮件模板）
	int64 SendUnixMs = 5; /// 收件/发件时间（服务端 Unix 毫秒）
	bool HasReward = 6; /// 是否有附件（内嵌附件非空；客户端据此画领取按钮/红点）
	bool Claimed = 7; /// 该账号对此邮件的领取态（已领=true / 未领=false）
}

/// 领取响应内单条奖励项：类型 + 目标 id + 数量（客户端据类型分别解析货币 / 道具元数据展示）
message MailRewardItem
{
	int32 RewardType = 1; /// 奖励类型：1=货币 / 2=道具（口径同 reward.ERewardType）
	int32 TargetId = 2; /// 目标 id：货币指 TbNum id，道具指 TbItemDef id
	int32 Amount = 3; /// 发放数量
}

/// 客户端拉邮件列表请求（无业务字段:身份从会话取,不携带账号;触发时机由客户端定）（§3.1）
message C2G_MailListRequest // IRequest,G2C_MailListResponse
{

}
/// 服务端拉列表响应（该账号应收、未过期的邮件 + 每封领取态）（§3.2）
message G2C_MailListResponse // IResponse
{
	MailClaimResultCode ResultCode = 1; /// 拉列表只有 Success / ServiceUnavailable 两种
	repeated MailListItem Mails = 2; /// 该账号应收（活跃广播 + 定向）且未过期的邮件；已过期不下发（服务端时钟已滤）
}

/// 客户端领取一封邮件请求（身份从会话取，不携带账号）（§3.3）
message C2G_MailClaimRequest // IRequest,G2C_MailClaimResponse
{
	string MailId = 1; /// 要领取的那封邮件标识（来自拉列表响应）；定位不到按「邮件不存在」返
}
/// 服务端领取裁决响应（结果码 + 成功时奖励列表）（§3.4）
message G2C_MailClaimResponse // IResponse
{
	MailClaimResultCode ResultCode = 1; /// 裁决结果码
	repeated MailRewardItem Rewards = 2; /// 仅 ResultCode=Success 时非空：该邮件内嵌附件全部发放的明细（类型 + 目标 id + 数量），供客户端展示
}

/// 服务端主动通知：该账号有新的定向邮件到达（SendMailTo 投递成功且目标在线时推送）。
/// 纯信号——不携带邮件数据；客户端收到后拉列表刷新收件箱 / 红点（红点仍基于服务端权威列表重算，不据推送内容判定）。
/// 离线不推（下次登录拉列表照常）；单向推送、丢失不重试（同 delta-push O6）。广播运营邮件不走本推送（保持拉取，避免全量扇出）。
message G2C_MailNotify // IMessage
{
}
