syntax = "proto3";

// PlayerPropertyMessage.proto
// 玩家属性服务端权威协议(Tier 2 第 1 子单:金币 / 钻石)。
// 设计基线:design-docs/37-player-attr-server.md §3.3 行为级协议契约。
// 玩家身份由服务端从联网会话取(GateAccountFlagComponent → Account.Name = UUID),
// 请求不携带账号、不携带绝对余额字段(反作弊红线:服务端永不信客户端传入绝对数值,见 §3.3.2)。
// handler 仅消费类型 + delta + reason 三字段(Code Review SV17 必拦)。

/// 属性类型(P3 十类:钻石 + 五类玩法货币/体力 + 五种元层进度计数器,服务端权威化,原云存档 blob 迁出第 1 批)
enum PropertyType
{
	Diamond = 0,         /// 钻石
	SoulPower = 1,       /// 灵力(玩法软货币,纯增减计数器)
	Piety = 2,           /// 虔诚币(长期主线货币,纯增减计数器)
	GuardianExp = 3,     /// 守护者累积经验(玩法侧第四种货币,纯增减计数器;与 PlayerDoc.Level/Exp 玩家账号经验不复用)
	Energy = 4,          /// 玩法体力(带离线随时间恢复;服务端按 EnergyLastRecoverMs + EnergyRecoverIntervalMs 懒结算)
	// P3 元层进度计数器(原云存档 blob 迁出第 1 批,纯数值进度;走同一套 PropertyChange 上报增量 + 限界信任落账)
	GoddessRating = 5,   /// 女神评级(玩法产出,单调递增)
	UnlockedChapter = 6, /// 章节解锁数(玩法产出,单调递增)
	BlindBoxCount = 7,   /// 盲盒计数(玩法产出;可增可减 —— 攒盒 +、开盒 -)
	TempleRepaired = 8,  /// 神庙修缮计数(动作产出,修缮动作触发,单调递增)
	NextRepairIndex = 9, /// 神庙修缮游标(动作产出,指向下一个待修缮项,单调递增)
}

/// 属性变更裁决结果码(§3.3.2 + §3.4)
enum PropertyChangeResultCode
{
	/// 成功并已写库 + 推送(响应附变更后该属性余额)
	Success = 0,
	/// 会话未挂账号身份(35 登录失败 / 链路异常)→ 客户端段下一刀重登
	NotLoggedIn = 1,
	/// 类型枚举未知(协议非法)
	UnknownType = 2,
	/// delta 范围非法(超出 [-类型上界, +类型上界],防 Int 极值绕过校验)
	InvalidRequest = 3,
	/// 余额不足(当前 + delta < 0,响应 NewAmount = 当前实际余额便于客户端 toast)
	NotEnough = 4,
	/// 类型上界溢出(当前 + delta > 上界,响应 NewAmount = 当前实际余额)
	OverLimit = 5,
	/// 服务不可用(MongoDB 不可达 / 写入异常)→ 客户端段下一刀提示重试,变更未生效
	ServiceUnavailable = 6,
}

/// 单条属性余额项(初始快照下发用,可复用)
message PropertyAmount
{
	PropertyType Type = 1;     /// 属性类型
	int64 Amount = 2;          /// 当前余额(服务端权威值)
}

/// 客户端发起属性变更声明请求(只声明相对增量 + 原因,身份从会话取)(§3.3.2)
message C2G_PropertyChangeRequest // IRequest,G2C_PropertyChangeResponse
{
	PropertyType Type = 1;     /// 要变更的属性类型
	int64 Delta = 2;           /// 有符号增量(正 = 增加 / 负 = 减少 / 消费;变长编码下 long 体积可接受,不强求 sint64 zigzag,Fantasy 导出工具不识别 sint64)
	string Reason = 3;         /// 变更来源标识(如 "shop_item_123" / "mail_claim_456" / "stamina_consume_level_789",供后续 ledger 审计)
}

/// 服务端属性变更裁决响应(§3.3.2)
message G2C_PropertyChangeResponse // IResponse
{
	PropertyChangeResultCode ResultCode = 1;   /// 裁决结果码
	PropertyType Type = 2;                     /// 回声请求的类型(便于客户端段下一刀路由更新到对应字段)
	int64 NewAmount = 3;                       /// 成功 = 变更后该属性新余额;NotEnough / OverLimit = 当前实际余额(供 toast「需要 X,你有 Y」);其它失败 = 0
}

/// 服务端属性变更主动推送(每次写库成功后服务端起,推送目标 = 该 UUID 在线全部会话,§3.3.3 + §5.4)
/// 推送是「绝对余额快照」非「相对变更流水」,丢失 = 下次登录拉快照对齐(O6 不重试)
message G2C_PropertyDeltaPush // IMessage
{
	PropertyType Type = 1;     /// 变更的属性类型
	int64 NewAmount = 2;       /// 变更后该属性新余额(绝对值,客户端段下一刀直接覆盖本地视图)
	string Reason = 3;         /// 变更来源标识(回声触发方传入的 reason,供客户端段下一刀做 toast / 弹奖动画的来源识别)
}

// =========================================================================
// 批量属性变更(传输层聚合,逐项独立裁决)。
// 客户端一次玩法事件同时改多个属性时,把 N 条 C2G_PropertyChangeRequest 收敛成 1 条本 RPC,减少往返。
// 语义非全或无:服务端对每一项独立调用与单条链路同一套 ChangeProperty(限界信任 + 频率闸 + 夹界 + 推送),
// 逐项收集结果回包 —— 一项溢出 / 余额不足不回滚也不阻断其它项(奖励互相独立)。
// 每个 PropertyType 在一个 batch 内最多出现一次,同 account|type 100ms 频率闸在 batch 内自然不误触。
// =========================================================================

/// 单条批量变更项(声明相对增量,身份从会话取,不携带账号 / 绝对余额)
message PropertyChangeItem
{
	PropertyType Type = 1;     /// 要变更的属性类型
	int64 Delta = 2;           /// 有符号增量(正 = 增加 / 负 = 减少 / 消费)
}

/// 单项裁决结果(结果码 + 变更后余额,口径同单条链路 G2C_PropertyChangeResponse)
message PropertyBatchChangeResultItem
{
	PropertyType Type = 1;                     /// 回声该项的属性类型
	PropertyChangeResultCode ResultCode = 2;   /// 该项裁决结果码
	int64 NewAmount = 3;                       /// 成功 = 变更后新余额;NotEnough / OverLimit = 当前实际余额;其它失败 = 0
}

/// 客户端批量属性变更请求(一次携带 N 项,身份从会话取)
message C2G_PropertyBatchChangeRequest // IRequest,G2C_PropertyBatchChangeResponse
{
	repeated PropertyChangeItem Items = 1;   /// 待变更项列表(空 → no-op,响应 Results 为空)
	string Reason = 2;                       /// 批次统一来源标识(逐项落账 reason = "{Reason}_{Type}",与单条链路口径一致)
}

/// 服务端批量变更逐项裁决响应(Results 顺序与请求 Items 一一对应;客户端也按 Type 匹配双保险)
message G2C_PropertyBatchChangeResponse // IResponse
{
	repeated PropertyBatchChangeResultItem Results = 1;   /// 逐项结果(每项独立裁决,含成功 / 各类失败)
}

// =========================================================================
// 属性变更流水查询(Tier 2 第 3 子单 · server 段 + 客户端协议生成物)。
// 设计基线:design-docs/45-player-attr-ledger-query.md §三 行为级协议契约。
// 身份从会话取(不携带账号);服务端只读 player_attr_ledger 集合(44 已建)+ 字段裁剪 7 字段白名单
// (不暴露 ObjectId / SchemaVersion / Account)。
// =========================================================================

/// 查询 ledger 流水裁决结果码(§3.3)
enum AttrLedgerQueryResultCode
{
	/// 查询成功(含返空数组的成功:limit=0 / 账号无 ledger / 过滤后无匹配)
	Success = 0,
	/// 参数非法(kind 整数未知 / sinceTs 负数 / limit 负数);limit 超 100 钳制不报错
	InvalidRequest = 1,
	/// 服务不可用(MongoDB 不可达 / 查询抛 Mongo 异常)
	ServiceUnavailable = 2
}

/// 单条 ledger 流水项(白名单 7 字段,不暴露 ObjectId / SchemaVersion / Account)(§3.2)
message AttrLedgerEntry
{
	int64 Timestamp = 1;         /// 该笔变更的应用端时刻(Unix 毫秒 UTC,= 44 Timestamp 同源)
	PropertyType Kind = 2;       /// 属性种类(沿 37 PropertyType 枚举)
	int64 BalanceBefore = 3;     /// 变更前余额(非负)
	int64 BalanceAfter = 4;      /// 变更后余额(非负,= BalanceBefore + Delta)
	int64 Delta = 5;             /// 相对变更量(有符号)
	int32 Source = 6;            /// 变更来源枚举码(= 服务端 AttrChangeSource 整数;客户端段下一刀映射为人类可读文本)
	string ReasonRaw = 7;        /// 调用方原始 reason 字符串(供运营 ad-hoc 查子分类如 mailId / codeId / rankIdx)
}

/// 客户端拉 ledger 流水请求(身份从会话取,不携带账号)(§3.1)
/// limit 必填(本子单不设默认);服务端钳制 [0, 100],超上限钳为 100 不报错(降级语义)。
message C2G_QueryAttrLedger // IRequest,G2C_QueryAttrLedgerResponse
{
	int32 Kind = 1;              /// 属性种类过滤(0 = 不过滤;1=Diamond / 2=SoulPower / 3=Piety / 4=GuardianExp / 5=Energy / 6=GoddessRating / 7=UnlockedChapter / 8=BlindBoxCount / 9=TempleRepaired / 10=NextRepairIndex,协议层整数 = PropertyType 枚举 + 1 错开一位作 sentinel,未知值返 InvalidRequest)
	int64 SinceTs = 2;           /// 时间下界(只返 Timestamp > SinceTs 的行;0 = 不过滤;负数返 InvalidRequest)
	int32 Limit = 3;             /// 单次最多返回行数(服务端钳制 [0, 100];Limit=0 返空 entries[];负数返 InvalidRequest)
}

/// 服务端查询响应(§3.2)
message G2C_QueryAttrLedgerResponse // IResponse
{
	AttrLedgerQueryResultCode ResultCode = 1;   /// 裁决结果码
	repeated AttrLedgerEntry Entries = 2;       /// 按 (Account, Timestamp DESC) 索引取出的 ledger 行,按 Timestamp DESC 排(最新在前);失败或返空时为空数组
	bool HasMore = 3;                           /// 是否还有更旧的行(true = 取到 Limit 条且存在 Timestamp 比最后一行更早的行)
}
