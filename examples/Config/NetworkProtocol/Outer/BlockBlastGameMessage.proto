syntax = "proto3";

// BlockBlastGameMessage.proto
// Block Blast 服务端权威发牌环路协议(Outer,运行在 Gate Scene)。
// 服务端是发牌唯一事实源:seed 服务端签发、候选形状(shapeId)服务端权威持有,
// place 请求只携带玩家输入(候选槽位 + 落点),绝不携带 shapeId —— 形状由客户端无从指定,
// 这是关闭选块作弊面的核心红线。
// 棋盘以 8 行位掩码(RowBinary,每行低 8 位有效)传输,与 BinaryBoard 内部表示同构。
//
// 局内叠加层切片(SliceJson):盘面颜色 / 元素叠加层 / 手牌 cosmetic / 合成区库存 / 连消态 / 订单本地统计等
// 叠在权威 shapeId 序列上、无法从服务端盘面重推的 cosmetic + 合成经济层,以不透明 JSON 字符串携带
// (客户端 MergeIngameSave 原文)。服务端只搬运、绝不解析/校验;搭车每步落子 / 消除道具上行,
// 随对局文档存盘;续局 / 快照下行原样回带供客户端 import。是云存档 blob 退役后该层的唯一服务端归属。

/// 发牌调度器完整状态向量:候选队列 + 跨手累积调度态 + PRNG 游标。
/// 供重连恢复与客户端发牌预测对账消费;权威态回带,不被客户端反向写入。
/// 含 PRNG 游标(RngS0/RngS1)后,客户端可在 snapshot / 对账时完全复位预测发牌器游标,
/// 即使曾真发散也能从此点逐位接续(不再退化为只靠服务端候选队列覆盖)。
message BlockGenState
{
	repeated int32 CandidateQueue = 1;   /// 当前候选队列 shapeId(队首=下一个待用候选;长度通常为 3)
	int32 DynamicWeight = 2;             /// 动态权重(跨手累积)
	int32 PreDynamicWeight = 3;          /// 上一手权重增量(同向/换向判定用)
	int32 RefillIndex = 4;               /// 本局已发过几次 trio(FirstRound 触发判定用)
	bool BcInWindow = 5;                 /// 清屏窗口是否激活
	int32 BcCooldown = 6;                /// 清屏冷却剩余回合
	int64 RngS0 = 7;                     /// xorshift128+ 内部状态字 s0(发牌游标;以 int64 承载 ulong 位型)
	int64 RngS1 = 8;                     /// xorshift128+ 内部状态字 s1(发牌游标;以 int64 承载 ulong 位型)
	int32 LastAlgo = 9;                  /// 当前候选批所用算法序号(-1 = 未激活/未发牌;AddWeight 反馈用)
	int32 LastTierId = 10;               /// 当前候选批所在 tier id(-2147483648 = null)
}

/// 客户端请求进入对局(身份从会话取,不携带账号 / 不上传 seed)。
/// 续局语义:服务端有在局(内存活实例或持久 Doc)则恢复、无则新建;消息名沿用 GameStart。
message C2G_GameStartRequest // IRequest,G2C_GameStartResponse
{
}
/// 服务端进入对局回带:gameId + seed + 当前候选(新建=首发 / 续局=恢复) + step + score + 完整生成器状态 + 续局标志。
/// 续局时 Step/Score/InitialTrio/Board/GeneratorState 全是恢复出的中断前权威态(非开局 0 态)。
message G2C_GameStartResponse // IResponse
{
	int64 GameId = 1;                    /// 本局唯一 id(服务端签发)
	int64 Seed = 2;                      /// 服务端签发的本局发牌种子(客户端发牌预测用,非用于服务端复算来源)
	repeated int32 InitialTrio = 3;      /// 当前候选队列 shapeId(新建=首发;续局=恢复出的当前候选)
	int32 Step = 4;                      /// 当前权威步号(新建 = 0;续局 = 恢复值)
	BlockGenState GeneratorState = 5;    /// 完整生成器状态向量(含 PRNG 游标)
	bool Resumed = 6;                    /// 是否为续局恢复(true=恢复已有对局;false=新建)
	int32 Score = 7;                     /// 当前权威分数(新建 = 0;续局 = 恢复值)
	repeated int32 Board = 8;            /// 当前权威棋盘 8 行位掩码(新建=空盘;续局=恢复盘面)
	string SliceJson = 9;                /// 局内 cosmetic + 合成经济叠加层不透明切片(续局=恢复出的切片原文;新建=空串)。服务端只搬运不解析,客户端 import
}

/// 客户端落子请求:只传输入(候选槽位 + 落点),形状服务端权威、不携带 shapeId(反作弊红线)
message C2G_PlaceRequest // IRequest,G2C_PlaceResponse
{
	int64 GameId = 1;                    /// 目标对局 id
	int32 BaseStep = 2;                  /// 客户端认为的当前步号(幂等基准:==执行 / <幂等回当前态 / >拒绝回快照)
	int32 CandidateIndex = 3;            /// 落哪个候选槽(0..2)
	int32 PosX = 4;                      /// 落点列(BinaryBoard 坐标 X)
	int32 PosY = 5;                      /// 落点行(BinaryBoard 坐标 Y)
	string SliceJson = 6;                /// 客户端当前局内叠加层不透明切片(MergeIngameSave JSON),搭车每步落子。服务端只搬运不解析,成功推进时随 Doc 存盘
}
/// 服务端落子裁决 + 最新权威态
message G2C_PlaceResponse // IResponse
{
	PlaceResultCode ResultCode = 1;      /// 落子裁决结果码
	int32 Step = 2;                      /// 执行后(或当前)权威步号
	int32 Score = 3;                     /// 当前权威分数
	int32 EliminatedLines = 4;           /// 本次消除的行列数(StepAdvanced 时有效)
	int32 NewCandidate = 5;              /// 补入队尾的新候选 shapeId(本步补牌时有效;未补为 -1)
	repeated int32 Board = 6;            /// 最新权威棋盘(8 行位掩码)
	BlockGenState GeneratorState = 7;    /// 最新完整生成器状态向量
	bool GameOver = 8;                   /// 终局信号:服务端判定当前候选无任一放置顺序可放(jam),本局结束
	int32 FinalScore = 9;                /// 终局权威最终分(GameOver=true 时有效;= 终局时 Score)
	int64 BestScore = 10;                /// 终局入榜后该榜当前最佳分(GameOver=true 且入榜服务可用时有效;否则 0)
	int64 NewEnergy = 11;                /// 落子后玩家权威体力绝对值(StepAdvanced 时服务端派生落账后余额;客户端用它对账体力,先扣 PlaceCost 再消行返还夹 EnergyCap)。非 StepAdvanced 分支或体力服务不可用时回带当前权威余额供对齐
}

/// 落子裁决结果码
enum PlaceResultCode
{
	/// step 推进成功(baseStep == 权威 step,落子合法已执行)
	StepAdvanced = 0,
	/// 幂等命中(baseStep < 权威 step):请求是已执行步的重发,回带当前权威态、不重复执行
	IdempotentReplay = 1,
	/// 步号超前(baseStep > 权威 step):客户端落后于权威,拒绝执行、回带当前权威态供重同步
	StepAhead = 2,
	/// 落子非法(候选槽空 / 越界 / 与已占冲突):不推进、回带当前权威态
	IllegalPlacement = 3,
	/// 对局不存在(gameId 在会话上查无此局)
	GameNotFound = 4,
	/// 会话未登录(无法确定身份)
	NotLoggedIn = 5
}

/// 客户端消除道具请求:清目标格所在整行整列(脱困道具,设计 49 §3.1)。
/// 只传输入(目标格 + 幂等基准步号),清哪些格 / 消耗多少体力全由服务端权威算,不携带体力值、不携带被清格。
/// 消除道具作为一次 board-mutating 动作推进 Step(与落子同一步号轴),但不消耗候选、不推进发牌调度、不续发新批。
message C2G_ClearToolRequest // IRequest,G2C_ClearToolResponse
{
	int64 GameId = 1;                    /// 目标对局 id
	int32 BaseStep = 2;                  /// 客户端认为的当前步号(幂等基准:==执行 / <幂等回当前态 / >拒绝回快照)
	int32 PosX = 3;                      /// 目标格列(BinaryBoard 坐标 X)
	int32 PosY = 4;                      /// 目标格行(BinaryBoard 坐标 Y)
	string SliceJson = 5;                /// 客户端当前局内叠加层不透明切片(MergeIngameSave JSON),搭车每次消除道具。服务端只搬运不解析,成功清行列时随 Doc 存盘
}
/// 服务端消除道具裁决 + 最新权威态
message G2C_ClearToolResponse // IResponse
{
	ClearToolResultCode ResultCode = 1;  /// 消除道具裁决结果码
	int32 Step = 2;                      /// 执行后(或当前)权威步号
	int32 Score = 3;                     /// 当前权威分数(消除道具不计分,回带当前值供对账)
	int32 ClearedCells = 4;              /// 本次清掉的格数(Cleared 时有效)
	repeated int32 Board = 5;            /// 最新权威棋盘(8 行位掩码)
	BlockGenState GeneratorState = 6;    /// 最新完整生成器状态向量(消除道具不推进发牌,回带当前态供对账)
	int64 NewEnergy = 7;                 /// 玩家体力绝对值:Cleared=扣费后余额 / NotEnoughEnergy=当前余额(供回滚乐观清);其余不改体力的分支为 0(客户端忽略,靠属性推送/快照对齐)
}

/// 消除道具裁决结果码
enum ClearToolResultCode
{
	/// 清除成功(baseStep == 权威 step,体力足额已扣,目标行列已清)
	Cleared = 0,
	/// 幂等命中(baseStep < 权威 step):已执行步的重发,回带当前权威态、不重复清、不重复扣体力
	IdempotentReplay = 1,
	/// 步号超前(baseStep > 权威 step):客户端落后于权威,拒绝执行、回带当前权威态供重同步
	StepAhead = 2,
	/// 目标格越界(row/col 不在 0..7):不清、不扣体力,回带当前权威态
	OutOfRange = 3,
	/// 体力不足(不够一次消除道具代价):不清、不扣体力,回带当前权威态(含当前体力)供回滚乐观清
	NotEnoughEnergy = 4,
	/// 对局不存在(gameId 在会话上查无此局)
	GameNotFound = 5,
	/// 会话未登录(无法确定身份)
	NotLoggedIn = 6,
	/// 服务端属性/持久服务不可用(MongoDB 不可达等):不清、不扣体力
	ServiceUnavailable = 7
}

/// 客户端请求当前对局完整快照(重连 / 恢复)
message C2G_GameSnapshotRequest // IRequest,G2C_GameSnapshotResponse
{
	int64 GameId = 1;                    /// 目标对局 id
}
/// 服务端回带完整权威态
message G2C_GameSnapshotResponse // IResponse
{
	GameSnapshotResultCode ResultCode = 1; /// 结果码
	repeated int32 Board = 2;            /// 棋盘(8 行位掩码)
	int32 Score = 3;                     /// 当前权威分数
	int32 Step = 4;                      /// 当前权威步号
	repeated int32 CandidateQueue = 5;   /// 当前候选队列 shapeId
	BlockGenState GeneratorState = 6;    /// 完整生成器状态向量
	string SliceJson = 7;                /// 局内 cosmetic + 合成经济叠加层不透明切片(恢复出的切片原文;无切片=空串)。服务端只搬运不解析,客户端 import
}

/// 查询快照结果码
enum GameSnapshotResultCode
{
	/// 查询成功
	Ok = 0,
	/// 对局不存在
	GameNotFound = 1,
	/// 会话未登录
	NotLoggedIn = 2
}
